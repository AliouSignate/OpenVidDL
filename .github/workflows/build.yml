# Construit automatiquement les exécutables Windows / macOS / Linux.
#  - À chaque push : les fichiers sont disponibles dans l'onglet « Actions » (section Artifacts).
#  - En publiant un tag (ex. v1.0.0) : une « Release » GitHub est créée avec les exécutables à télécharger.
name: Build executables

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: OpenVidDL-Windows
            files: dist/OpenVidDL-Setup-*.exe
          - os: macos-latest          # Apple Silicon (M1/M2/M3/M4)
            artifact: OpenVidDL-macOS
            files: dist/OpenVidDL-macOS.dmg
          - os: ubuntu-22.04          # glibc 2.35 : compatible avec la plupart des distributions récentes
            artifact: OpenVidDL-Linux
            files: dist/OpenVidDL-Linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Construction
        run: python build.py

      - name: Archive Linux
        if: runner.os == 'Linux'
        run: |
          cd dist && cp ../README.md ../LICENSE . && tar czf OpenVidDL-Linux-x86_64.tar.gz OpenVidDL README.md LICENSE

      - name: Portable Windows (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/OpenVidDL/* -DestinationPath dist/OpenVidDL-Windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.files }}
            dist/OpenVidDL-Windows-portable.zip
          if-no-files-found: error

      - name: Publication de la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.files }}
            dist/OpenVidDL-Windows-portable.zip
          fail_on_unmatched_files: false
