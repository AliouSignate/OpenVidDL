# Construit automatiquement les exécutables Windows / macOS / Linux.
#  - À chaque push : les fichiers sont disponibles dans l'onglet « Actions » (section Artifacts).
#  - En publiant une « Release » sur GitHub (bouton « Create a new release », tag ex. v1.0.0) :
#    les exécutables sont compilés puis ajoutés automatiquement à la page de téléchargement.
name: Build executables

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: OpenVidDL-Windows
            files: dist/OpenVidDL-Setup-*.exe
          - os: macos-latest          # Apple Silicon (M1/M2/M3/M4)
            artifact: OpenVidDL-macOS
            files: dist/OpenVidDL-macOS.dmg
          - os: ubuntu-22.04          # glibc 2.35 : compatible avec la plupart des distributions récentes
            artifact: OpenVidDL-Linux
            files: dist/OpenVidDL-Linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Construction
        run: python build.py

      - name: Archive Linux
        if: runner.os == 'Linux'
        run: |
          cd dist && cp ../README.md ../LICENSE . && tar czf OpenVidDL-Linux-x86_64.tar.gz OpenVidDL README.md LICENSE

      - name: Portable Windows (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/OpenVidDL/* -DestinationPath dist/OpenVidDL-Windows-portable.zip

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.files }}
            dist/OpenVidDL-Windows-portable.zip
          if-no-files-found: error

      - name: Publication de la release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.files }}
            dist/OpenVidDL-Windows-portable.zip
          tag_name: ${{ github.event.release.tag_name }}
          fail_on_unmatched_files: false

  # Extension navigateur (Chrome, Edge, Brave, Opera, Vivaldi, Firefox)
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version de l'extension = version de l'application
        run: |
          VER=$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' app.py)
          jq --arg v "$VER" '.version = $v' extension/manifest.json > m.json && mv m.json extension/manifest.json
      - name: Vérification (outil officiel Mozilla)
        run: npx --yes web-ext@latest lint --source-dir extension
      - name: Paquets
        run: |
          mkdir -p dist
          (cd extension && zip -qr ../dist/OpenVidDL-Extension.zip .)
      - name: Signature Firefox (si les clés addons.mozilla.org sont configurées)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        if: github.event_name == 'release'
        run: |
          if [ -z "$AMO_JWT_ISSUER" ]; then echo "Clés AMO absentes : signature Firefox ignorée."; exit 0; fi
          npx --yes web-ext@latest sign --source-dir extension --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --artifacts-dir signed
          cp signed/*.xpi dist/OpenVidDL-Extension-Firefox.xpi
      - uses: actions/upload-artifact@v5
        with:
          name: OpenVidDL-Extension
          path: dist/OpenVidDL-Extension*
      - name: Publication de la release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/OpenVidDL-Extension*

  # Après une release : met à jour les boutons de téléchargement de la page d'accueil (README)
  update-readme:
    needs: [build, extension]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Liens vers la nouvelle version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER=$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' app.py)
          sed -i -E \
            -e "s#releases/download/[^/]+/#releases/download/${TAG}/#g" \
            -e "s#OpenVidDL-Setup-[0-9][0-9A-Za-z.-]*\.exe#OpenVidDL-Setup-${VER}.exe#g" \
            -e "s#<sub>Version [^ ]+ ·#<sub>Version ${VER} ·#" \
            README.md
          if git diff --quiet; then echo "README déjà à jour"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "README : liens de téléchargement vers ${TAG}"
          git push
