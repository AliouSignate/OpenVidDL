<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenVidDL — Téléchargeur de vidéos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬇️</text></svg>">
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--text:#e8eaf0;--muted:#8b93a7;
        --accent:#4f8cff;--accent2:#3a6fd8;--ok:#2fbf71;--err:#ef5350;--warn:#f0a630;--radius:12px}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:880px;margin:0 auto;padding:28px 18px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  h1{font-size:22px;margin:0;letter-spacing:-.3px}
  h1 span{color:var(--accent)}
  .meta{color:var(--muted);font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px}
  textarea,select,input[type=text]{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);
        border-radius:10px;padding:12px 14px;font:inherit;outline:none}
  textarea:focus,select:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:58px}
  label.small{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .check{display:flex;align-items:center;gap:8px;color:var(--text);cursor:pointer;user-select:none;font-size:14px}
  .check input{width:17px;height:17px;accent-color:var(--accent)}
  button{font:inherit;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;background:var(--panel2);color:var(--text);
         border:1px solid var(--line);transition:.15s}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{background:var(--accent2)}
  button:disabled{opacity:.5;cursor:default}
  button.icon{padding:7px 11px;font-size:13px}
  .spacer{flex:1}
  .preview{display:none;gap:14px;margin-top:14px;padding:12px;background:var(--panel2);border-radius:10px;align-items:center}
  .preview img{width:150px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:#000;flex-shrink:0}
  .preview .t{font-weight:600}
  .preview .s{color:var(--muted);font-size:13px}
  .msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;display:none;white-space:pre-wrap}
  .msg.err{display:block;background:rgba(239,83,80,.12);color:#ff8a87}
  .msg.ok{display:block;background:rgba(47,191,113,.12);color:#6fe0a2}
  .jobs-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .jobs-head h2{font-size:16px;margin:0}
  .job{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
  .job .top{display:flex;gap:10px;align-items:flex-start}
  .job .title{font-weight:600;word-break:break-word}
  .job .url{color:var(--muted);font-size:12px;word-break:break-all}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .bar{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;margin:10px 0 6px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
  .bar.indet>i{width:35%;animation:ind 1.2s infinite ease-in-out}
  @keyframes ind{0%{margin-left:-35%}100%{margin-left:100%}}
  .job.done .bar>i{background:var(--ok)} .job.error .bar>i{background:var(--err)}
  .line{display:flex;gap:12px;font-size:13px;color:var(--muted);flex-wrap:wrap}
  .st-done{color:var(--ok)} .st-error{color:var(--err)} .st-cancelled{color:var(--warn)}
  .err-txt{color:#ff8a87;font-size:13px;white-space:pre-wrap;margin-top:6px}
  .files{margin-top:8px;display:flex;flex-direction:column;gap:4px}
  .files a{color:var(--accent);text-decoration:none;font-size:13px;word-break:break-all}
  .files a:hover{text-decoration:underline}
  .empty{color:var(--muted);text-align:center;padding:26px;border:1px dashed var(--line);border-radius:var(--radius)}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
  footer a{color:var(--muted)}
  @media (max-width:560px){.preview{flex-direction:column;align-items:flex-start}.preview img{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>⬇ Open<span>VidDL</span></h1>
      <div class="meta" id="status">Chargement…</div>
    </div>
    <div class="row" style="margin:0">
      <button class="icon" id="btnFolder" title="Ouvrir le dossier des téléchargements">📂 Dossier</button>
      <button class="icon" id="btnUpdate" title="Mettre à jour le moteur yt-dlp">⟳ Mettre à jour</button>
      <button class="icon" id="btnQuit" title="Arrêter OpenVidDL">⏻ Quitter</button>
    </div>
  </header>

  <div class="card">
    <label class="small" for="urls">Lien(s) — un par ligne</label>
    <textarea id="urls" placeholder="https://www.youtube.com/watch?v=…&#10;https://vimeo.com/…" spellcheck="false"></textarea>

    <div class="grid">
      <div>
        <label class="small" for="format">Format</label>
        <select id="format">
          <optgroup label="Vidéo">
            <option value="mp4" selected>MP4 (compatible partout)</option>
            <option value="mkv">MKV</option>
            <option value="webm">WEBM</option>
            <option value="mov">MOV</option>
            <option value="avi">AVI</option>
            <option value="original">Original (sans conversion)</option>
          </optgroup>
          <optgroup label="Audio uniquement">
            <option value="mp3">MP3</option>
            <option value="m4a">M4A / AAC</option>
            <option value="opus">OPUS</option>
            <option value="flac">FLAC (sans perte)</option>
            <option value="wav">WAV</option>
            <option value="ogg">OGG Vorbis</option>
          </optgroup>
        </select>
      </div>
      <div>
        <label class="small" for="quality">Qualité max</label>
        <select id="quality">
          <option value="best">La meilleure</option>
          <option value="4320">8K (4320p)</option>
          <option value="2160">4K (2160p)</option>
          <option value="1440">1440p</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
          <option value="240">240p</option>
        </select>
      </div>
      <div>
        <label class="small" for="cookies">Cookies (vidéos privées / 18+)</label>
        <select id="cookies">
          <option value="">Aucun</option>
          <option value="chrome">Chrome</option>
          <option value="firefox">Firefox</option>
          <option value="edge">Edge</option>
          <option value="brave">Brave</option>
          <option value="opera">Opera</option>
          <option value="vivaldi">Vivaldi</option>
          <option value="chromium">Chromium</option>
          <option value="safari">Safari</option>
        </select>
      </div>
    </div>

    <div class="row">
      <label class="check"><input type="checkbox" id="playlist"> Playlist / chaîne entière</label>
      <label class="check"><input type="checkbox" id="subtitles"> Sous-titres (FR/EN)</label>
      <span class="spacer"></span>
      <button id="btnInfo">Aperçu</button>
      <button class="primary" id="btnGo">Télécharger</button>
    </div>

    <div class="preview" id="preview">
      <img id="pvImg" alt="">
      <div>
        <div class="t" id="pvTitle"></div>
        <div class="s" id="pvSub"></div>
      </div>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="jobs-head">
    <h2>Téléchargements</h2>
    <span class="spacer"></span>
    <button class="icon" id="btnClear">Effacer les terminés</button>
  </div>
  <div id="jobs"><div class="empty">Collez un lien ci-dessus pour commencer.</div></div>

  <footer>
    OpenVidDL v{{ version }} — logiciel libre (MIT), propulsé par <a href="https://github.com/yt-dlp/yt-dlp" target="_blank" rel="noopener">yt-dlp</a> et FFmpeg.<br>
    Téléchargez uniquement des contenus dont vous avez le droit, dans le respect des conditions des plateformes.
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const api = async (path, opts = {}) => {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts});
  let data = {}; try { data = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error(data.error || `Erreur ${r.status}`);
  return data;
};
const msg = (text, kind = "err") => { const m = $("msg"); m.className = "msg " + (text ? kind : ""); m.textContent = text || ""; };
const urls = () => $("urls").value.split(/\s+/).map(s => s.trim()).filter(Boolean);
const fmtBytes = b => { if (!b) return ""; const u = ["o/s","Ko/s","Mo/s","Go/s"]; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return b.toFixed(1) + " " + u[i]; };
const fmtTime = s => { if (s == null) return ""; s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
const STATUS = {queued:"En attente", starting:"Analyse…", downloading:"Téléchargement", processing:"Traitement",
                done:"Terminé ✓", error:"Échec", cancelled:"Annulé"};
const ACTIVE = new Set(["queued","starting","downloading","processing"]);
let isLocal = true;

async function loadStatus() {
  try {
    const s = await api("/api/status");
    isLocal = s.local;
    $("status").textContent = `${s.sites ? s.sites + " sites pris en charge · " : ""}moteur yt-dlp ${s.ytdlp} · FFmpeg : ${s.ffmpeg || "absent ⚠"} · 📁 ${s.download_dir}`;
    if (!isLocal) ["btnFolder", "btnUpdate", "btnQuit"].forEach(id => $(id).style.display = "none");
  } catch (e) { $("status").textContent = "Serveur injoignable"; }
}

$("btnInfo").onclick = async () => {
  const list = urls(); if (!list.length) return msg("Collez d'abord un lien.");
  msg(""); $("btnInfo").disabled = true; $("btnInfo").textContent = "Analyse…"; $("preview").style.display = "none";
  try {
    const i = await api("/api/info", {method: "POST", body: JSON.stringify({url: list[0], playlist: $("playlist").checked, cookies: $("cookies").value})});
    $("pvImg").src = i.thumbnail || ""; $("pvImg").style.display = i.thumbnail ? "" : "none";
    $("pvTitle").textContent = i.title || "(sans titre)";
    const parts = [i.site, i.uploader, i.duration ? fmtTime(i.duration) : null,
                   i.is_playlist ? `${i.count} éléments` : null,
                   i.heights && i.heights.length ? `jusqu'à ${i.heights[0]}p` : null].filter(Boolean);
    $("pvSub").textContent = parts.join(" · ");
    $("preview").style.display = "flex";
  } catch (e) { msg(e.message); }
  $("btnInfo").disabled = false; $("btnInfo").textContent = "Aperçu";
};

$("btnGo").onclick = async () => {
  const list = urls(); if (!list.length) return msg("Collez au moins un lien.");
  msg(""); $("btnGo").disabled = true;
  try {
    await api("/api/download", {method: "POST", body: JSON.stringify({
      urls: list, format: $("format").value, quality: $("quality").value,
      playlist: $("playlist").checked, subtitles: $("subtitles").checked, cookies: $("cookies").value})});
    $("urls").value = ""; $("preview").style.display = "none";
    refresh();
  } catch (e) { msg(e.message); }
  $("btnGo").disabled = false;
};

$("urls").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("btnGo").click(); });
$("format").onchange = () => { $("quality").disabled = ["mp3","m4a","opus","flac","wav","ogg"].includes($("format").value); };
$("btnClear").onclick = async () => { await api("/api/jobs/clear", {method: "POST"}); refresh(); };
$("btnFolder").onclick = async () => { try { await api("/api/open-folder", {method: "POST"}); } catch (e) { msg(e.message); } };
$("btnQuit").onclick = async () => {
  if (!confirm("Arrêter OpenVidDL ? Les téléchargements en cours seront interrompus.")) return;
  try { await api("/api/shutdown", {method: "POST"}); } catch (_) {}
  clearTimeout(timer);
  document.body.innerHTML = '<div class="wrap"><div class="empty" style="margin-top:80px">OpenVidDL est arrêté. Vous pouvez fermer cet onglet.<br>Pour le relancer, ouvrez l\'application depuis votre bureau ou le menu Démarrer.</div></div>';
};
$("btnUpdate").onclick = async () => {
  const b = $("btnUpdate"); b.disabled = true; b.textContent = "⟳ Mise à jour…";
  try {
    const r = await api("/api/update", {method: "POST"});
    msg(r.restart ? `Moteur mis à jour (${r.version}). Redémarrez OpenVidDL pour l'utiliser.` : `Le moteur est déjà à jour (${r.version}).`, "ok");
  } catch (e) { msg(e.message); }
  b.disabled = false; b.textContent = "⟳ Mettre à jour";
};

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render(jobs) {
  const box = $("jobs"); box.innerHTML = "";
  if (!jobs.length) { box.appendChild(el("div", "empty", "Collez un lien ci-dessus pour commencer.")); return; }
  for (const j of jobs) {
    const card = el("div", "job " + j.status);
    const top = el("div", "top");
    const info = el("div"); info.style.flex = "1"; info.style.minWidth = "0";
    info.appendChild(el("div", "title", j.title || j.url));
    if (j.title) info.appendChild(el("div", "url", j.url));
    top.appendChild(info);
    top.appendChild(el("span", "badge", j.format));
    if (ACTIVE.has(j.status)) {
      const c = el("button", "icon", "Annuler");
      c.onclick = () => api(`/api/jobs/${j.id}/cancel`, {method: "POST"}).then(refresh);
      top.appendChild(c);
    } else {
      const c = el("button", "icon", "✕"); c.title = "Retirer de la liste";
      c.onclick = () => api(`/api/jobs/${j.id}`, {method: "DELETE"}).then(refresh);
      top.appendChild(c);
    }
    card.appendChild(top);

    const bar = el("div", "bar"), fill = el("i"); bar.appendChild(fill);
    const indet = (j.status === "starting" || j.status === "processing" || (j.status === "downloading" && j.progress == null));
    if (indet) bar.classList.add("indet"); else fill.style.width = (j.status === "done" || j.status === "error" ? 100 : (j.progress || 0)) + "%";
    card.appendChild(bar);

    const line = el("div", "line");
    line.appendChild(el("span", "st-" + j.status, STATUS[j.status] || j.status));
    if (j.stage && ACTIVE.has(j.status)) line.appendChild(el("span", null, j.stage));
    if (j.n_items && j.item) line.appendChild(el("span", null, `Élément ${j.item}/${j.n_items}`));
    if (j.status === "downloading" && j.progress != null) line.appendChild(el("span", null, j.progress.toFixed(1) + " %"));
    if (j.speed) line.appendChild(el("span", null, fmtBytes(j.speed)));
    if (j.eta != null && j.status === "downloading") line.appendChild(el("span", null, "reste " + fmtTime(j.eta)));
    if (j.status === "done") line.appendChild(el("span", null, j.files.length + " fichier(s)"));
    card.appendChild(line);

    if (j.error) card.appendChild(el("div", "err-txt", j.error));
    if (j.files && j.files.length) {
      const f = el("div", "files");
      j.files.slice(0, 50).forEach((file, n) => {
        const a = el("a", null, "⬇ " + file.name); a.href = `/api/file/${j.id}/${n}`; a.title = file.path; f.appendChild(a);
      });
      if (j.files.length > 50) f.appendChild(el("span", "url", `… et ${j.files.length - 50} autres dans le dossier`));
      card.appendChild(f);
    }
    box.appendChild(card);
  }
}

let timer = null, lastJson = "";
async function refresh() {
  clearTimeout(timer);
  let jobs = [];
  try {
    jobs = await api("/api/jobs");
    const json = JSON.stringify(jobs);
    if (json !== lastJson) { render(jobs); lastJson = json; }
  } catch (_) {}
  timer = setTimeout(refresh, jobs.some(j => ACTIVE.has(j.status)) ? 800 : 3000);
}

loadStatus(); refresh();
</script>
</body>
</html>
